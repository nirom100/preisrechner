<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preisrechner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <div class="calc-container">
        <h1>Preisrechner</h1>

        <div class="items">
          <button class="item-card">
            <span class="item-title">Kaffee</span>
            <span class="item-price">3.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Tee</span>
            <span class="item-price">2.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Apfelschorle</span>
            <span class="item-price">4.00 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Wasser</span>
            <span class="item-price">2.00 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Bratwurst</span>
            <span class="item-price">5.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Schnitzel</span>
            <span class="item-price">12.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Currywurst</span>
            <span class="item-price">6.00 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Brezel</span>
            <span class="item-price">4.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Käsespätzle</span>
            <span class="item-price">8.00 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Insekten</span>
            <span class="item-price">3.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Pommes</span>
            <span class="item-price">3.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Apfelstrudel</span>
            <span class="item-price">4.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Berliner</span>
            <span class="item-price">3.00 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Waffeln</span>
            <span class="item-price">4.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Brötchen</span>
            <span class="item-price">2.50 €</span>
          </button>
          <button class="item-card">
            <span class="item-title">Gänsekeule</span>
            <span class="item-price">14.50 €</span>
          </button>
        </div>

        <hr class="divider" />

        <div class="checkout-container">
          <div class="checkout">
            <h3>Gesamt</h3>
            <p class="total">0,00 €</p>
          </div>
          <div class="checkout-buttons">
            <button class="btn btn-reset">Zurücksetzen</button>
            <div class="order-buttons">
              <button class="btn btn-inhouse">Vor Ort</button>
              <button class="btn btn-delivery">Lieferung</button>
            </div>
          </div>
        </div>
      </div>

      <div class="order-container">
        <div class="bestellung-card-container">
          <h1>Bestellung</h1>
        </div>
      </div>
    </main>
  </body>
</html>
